name: Hello World

on: [push]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
      
      - name: Show date
        run: date
      
      - name: Show runner info
        run: |
          echo "OS: $RUNNER_OS"
          echo "Arch: $RUNNER_ARCH"